[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "log-parser"
version = "0.1.0"
description = "Real-time log parser with regex-based extraction and JSONL output"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
log-parser = "log_parser.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
log_parser = ["patterns.yaml", "alerts.yaml", "dashboard.html"]
