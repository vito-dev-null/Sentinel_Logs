alert_rules:
  - name: ssh-failed-password
    field: message
    regex: "Failed password for|Invalid user|authentication failure|auth failure|Failed publickey"
  - name: fail2ban-ban-action
    field: message
    regex: '(?i)\bBan\b'
  - name: google-suspicious-login
    field: event_action
    equals: google_suspicious_login
  - name: app-errors
    field: level
    equals: ERROR
