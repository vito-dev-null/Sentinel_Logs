services:
  log-init:
    image: alpine:3.20
    command: ["sh", "-c", "mkdir -p /logs && touch /logs/app.log && chown 10001:10001 /logs/app.log && chmod 640 /logs/app.log"]
    volumes:
      - app_logs:/logs

  output-init:
    image: alpine:3.20
    command: ["sh", "-c", "mkdir -p /output && chown -R 10001:10001 /output"]
    volumes:
      - app_output:/output

  tls-init:
    image: alpine:3.20
    command: >-
      sh -c 'apk add --no-cache openssl >/dev/null &&
      if [ ! -f /tls/tls.crt ] || [ ! -f /tls/tls.key ]; then
      openssl req -x509 -nodes -newkey rsa:2048 -days 365
      -subj "/CN=sentinellogs" -keyout /tls/tls.key -out /tls/tls.crt >/dev/null 2>&1;
      cp /tls/tls.crt /tls/ca.crt; fi; chown 10001:10001 /tls/tls.key; chmod 640 /tls/tls.key'
    volumes:
      - app_tls:/tls

  sentinellogs:
    build:
      context: .
    image: sentinellogs:latest
    env_file: .sentinellogs/secrets.env
    command:
      - --file
      - /var/log/app/app.log
      - --sink
      - stdout
      - --sink
      - file:/var/log/output/parsed.jsonl
      - --metrics-port
      - "9090"
      - --metrics-host
      - 0.0.0.0
      - --ingestion-port
      - "9443"
      - --ingestion-certfile
      - /app/tls/tls.crt
      - --ingestion-keyfile
      - /app/tls/tls.key
    volumes:
      - app_logs:/var/log/app:ro
      - app_output:/var/log/output
      - app_tls:/app/tls:ro
    expose:
      - "9090"
    depends_on:
      log-init:
        condition: service_completed_successfully
      output-init:
        condition: service_completed_successfully
      tls-init:
        condition: service_completed_successfully
    environment:
      STORAGE_BACKEND: jsonl
      STORAGE_PATH: ${STORAGE_PATH:-/var/log/output}
      QUEUE_BACKEND: off
      SENTINELLOGS_LOG_MAX_BYTES: ${SENTINELLOGS_LOG_MAX_BYTES:-10485760}
      SENTINELLOGS_LOG_RETENTION_DAYS: ${SENTINELLOGS_LOG_RETENTION_DAYS:-7}
      SENTINELLOGS_LOG_MAX_FILES: ${SENTINELLOGS_LOG_MAX_FILES:-5}
    healthcheck:
      test: ["CMD", "python", "-c", "import base64, os, urllib.request; credentials=os.environ['SENTINELLOGS_BASIC_AUTH'].encode(); request=urllib.request.Request('http://127.0.0.1:9090/health', headers={'Authorization': 'Basic '+base64.b64encode(credentials).decode()}); urllib.request.urlopen(request)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      sentinellogs:
        condition: service_started
    ports:
      - "${SENTINELLOGS_BIND_ADDRESS:-127.0.0.1}:80:80"
      - "${SENTINELLOGS_BIND_ADDRESS:-127.0.0.1}:443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - app_tls:/etc/nginx/tls:ro

volumes:
  app_logs:
  app_output:
  app_tls:
