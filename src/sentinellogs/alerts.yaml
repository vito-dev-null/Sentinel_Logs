alert_rules:
  - name: ssh-failed-password
    field: message
    regex: "Failed password for|Invalid user|authentication failure|auth failure|Failed publickey"
  - name: ssh-login-success
    field: message
    regex: "Accepted password for|Accepted publickey for|session opened for user"
  - name: sudo-privileged-command
    field: message
    regex: "sudo: .*COMMAND="
  - name: app-errors
    field: level
    equals: ERROR
